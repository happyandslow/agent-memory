<tspan x="90.0" dy="14.2">Z[32:40)  (8)</tspan>
</text>
<text x="855.0" y="488.0" font-size="18" fill="#172033" text-anchor="start">
<tspan x="855.0" dy="17.1">A3 t=0, block y=96</tspan>
<tspan x="855.0" dy="22.5">Z[0:16)</tspan>
</text>
<text x="855.0" y="576.0" font-size="18" fill="#172033" text-anchor="start">
<tspan x="855.0" dy="17.1">A3 t=1, block y=97</tspan>
<tspan x="855.0" dy="22.5">Z[16:32)</tspan>
</text>
<text x="855.0" y="664.0" font-size="18" fill="#172033" text-anchor="start">
<tspan x="855.0" dy="17.1">A3 t=2, block y=98</tspan>
<tspan x="855.0" dy="22.5">Z[32:48)</tspan>
</text>
<text x="40.0" y="755.0" font-size="17" fill="#172033" text-anchor="start">
<tspan x="40.0" dy="16.1">C14 WEST: every A3 column receives the assembled 16-element shard.</tspan>
</text>
<text x="20.0" y="797.0" font-size="17" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="16.1">Orange Z[10:20): SOUTH from y=1; split at y=96 into Z[10:16) WEST and Z[16:20) continuing SOUTH.</tspan>
</text>
<text x="20.0" y="835.0" font-size="17" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="16.1">At y=97, remaining orange joins green + purple: 4 + 10 + 2 = 16 elements, then turns WEST.</tspan>
</text>
<text x="20.0" y="873.0" font-size="16" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="15.2">Purple Z[30:40): 2 elements exit at y=97; 8 continue to y=98 and join Z[40:48) from later sources (omitted).</tspan>
</text>
<text x="20.0" y="911.0" font-size="17" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="16.1">Join is concatenation by feature offset, not a sum. Each C14 send waits until all 16 elements are assembled.</tspan>
</text>
<text x="20.0" y="949.0" font-size="16" fill="#64748b" text-anchor="start">
<tspan x="20.0" dy="15.2">C12/C13 SOUTH stays inside A2, including y=80..95 opposite the left-side gap. Rows/strokes are expanded.</tspan>
</text>
<text x="20.0" y="987.0" font-size="17" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="16.1">All features i: A2(0, floor(i/10)) -&gt; SOUTH to y=96+floor(i/16) -&gt; WEST across A3 row floor(i/16).</tspan>
</text>
<text x="20.0" y="1025.0" font-size="16" fill="#64748b" text-anchor="start">
<tspan x="20.0" dy="15.2">Scope starts after A2 computes Z = attention output + residual X. Multiple vertical strokes share x=0.</tspan>
</text>
