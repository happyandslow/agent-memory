<text x="20.0" y="15.0" font-size="28" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="26.6">Z | one A2 source shard splits toward different A3 rows</tspan>
</text>
<text x="20.0" y="57.0" font-size="16" fill="#64748b" text-anchor="start">
<tspan x="20.0" dy="15.2">A2 row s owns Z[10s:10s+10); A3 row t owns Z[16t:16t+16), located at block y=96+t.</tspan>
</text>
<text x="20.0" y="86.0" font-size="16" fill="#64748b" text-anchor="start">
<tspan x="20.0" dy="15.2">Arrow hue = source data identity. C8 / C9 / ... labels = actual fabric color IDs.</tspan>
</text>
