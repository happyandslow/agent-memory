</text>
<text x="20.0" y="440.0" font-size="17" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="16.1">Blue: whole X[0:32) shown.</tspan>
<tspan x="20.0" dy="21.2">Orange: whole X[32:64) shown.</tspan>
<tspan x="20.0" dy="21.2">Gray: only X[64:70) shown</tspan>
<tspan x="20.0" dy="21.2">to complete the row-6 join.</tspan>
</text>
<text x="20.0" y="550.0" font-size="18" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="17.1">At A2 y=3:</tspan>
<tspan x="20.0" dy="22.5">2 blue + 8 orange = 10.</tspan>
<tspan x="20.0" dy="22.5">At A2 y=6:</tspan>
<tspan x="20.0" dy="22.5">4 orange + 6 gray = 10.</tspan>
<tspan x="20.0" dy="22.5">Join by offset; no addition.</tspan>
</text>
<text x="20.0" y="685.0" font-size="16" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="15.2">A2 y=0 keeps X[0:10)</tspan>
<tspan x="20.0" dy="20.0">without a SOUTH hop.</tspan>
<tspan x="20.0" dy="20.0">Every other blue fragment</tspan>
<tspan x="20.0" dy="20.0">turns SOUTH, then EAST.</tspan>
</text>
<text x="20.0" y="810.0" font-size="17" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="16.1">Three vertical strokes denote the SAME physical A2 edge column, not three columns or queues.</tspan>
</text>
<text x="20.0" y="847.0" font-size="17" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="16.1">The PE receives/forwards 2-element atoms, keeps its own 10, then broadcasts the assembled 10-element row.</tspan>
</text>
<text x="20.0" y="884.0" font-size="17" fill="#172033" text-anchor="start">
<tspan x="20.0" dy="16.1">All features i: A1(127, floor(i/32)) -&gt; A2(0, same y) -&gt; SOUTH to floor(i/10) -&gt; EAST across A2.</tspan>
</text>
<text x="20.0" y="921.0" font-size="16" fill="#64748b" text-anchor="start">
<tspan x="20.0" dy="15.2">C12 sends from even y; C13 from odd y. The source hue stays unchanged across these fabric-color changes.</tspan>
</text>
<text x="20.0" y="957.0" font-size="16" fill="#64748b" text-anchor="start">
<tspan x="20.0" dy="15.2">Only y=0..6 expanded here. A2 continues to y=255; relay never needs to go through A3 or the left-side gap.</tspan>
</text>
