    <g fill="#fde68a"><rect class="cell" x="0" y="0" width="50" height="34"/><rect class="cell" x="50" y="0" width="50" height="34"/><rect class="cell" x="100" y="0" width="50" height="34"/><rect class="cell" x="150" y="0" width="50" height="34"/><rect class="cell" x="0" y="34" width="50" height="34"/><rect class="cell" x="50" y="34" width="50" height="34"/><rect class="cell" x="100" y="34" width="50" height="34"/><rect class="cell" x="150" y="34" width="50" height="34"/></g>
    <g fill="#e2e8f0"><rect class="cell" x="0" y="68" width="50" height="34"/><rect class="cell" x="50" y="68" width="50" height="34"/><rect class="cell" x="100" y="68" width="50" height="34"/><rect class="cell" x="150" y="68" width="50" height="34"/><rect class="cell" x="0" y="102" width="50" height="34"/><rect class="cell" x="50" y="102" width="50" height="34"/><rect class="cell" x="100" y="102" width="50" height="34"/><rect class="cell" x="150" y="102" width="50" height="34"/></g>
    <text x="218" y="53" class="body">2 live rows</text><text x="218" y="115" class="body">2 capacity rows</text>
  </g>
  <g transform="translate(980,365)">
    <text x="0" y="-10" class="body">request b0 — length 1</text>
    <g fill="#fde68a"><rect class="cell" x="0" y="0" width="50" height="34"/><rect class="cell" x="50" y="0" width="50" height="34"/><rect class="cell" x="100" y="0" width="50" height="34"/><rect class="cell" x="150" y="0" width="50" height="34"/></g>
    <g fill="#e2e8f0"><rect class="cell" x="0" y="34" width="50" height="34"/><rect class="cell" x="50" y="34" width="50" height="34"/><rect class="cell" x="100" y="34" width="50" height="34"/><rect class="cell" x="150" y="34" width="50" height="34"/><rect class="cell" x="0" y="68" width="50" height="34"/><rect class="cell" x="50" y="68" width="50" height="34"/><rect class="cell" x="100" y="68" width="50" height="34"/><rect class="cell" x="150" y="68" width="50" height="34"/><rect class="cell" x="0" y="102" width="50" height="34"/><rect class="cell" x="50" y="102" width="50" height="34"/><rect class="cell" x="100" y="102" width="50" height="34"/><rect class="cell" x="150" y="102" width="50" height="34"/></g>
    <text x="218" y="28" class="body">1 live row</text><text x="218" y="100" class="body">3 capacity rows</text>
  </g>
  <g transform="translate(1365,365)">
    <text x="0" y="-10" class="body">request b1 — length 3</text>
    <g fill="#fde68a"><rect class="cell" x="0" y="0" width="50" height="34"/><rect class="cell" x="50" y="0" width="50" height="34"/><rect class="cell" x="100" y="0" width="50" height="34"/><rect class="cell" x="150" y="0" width="50" height="34"/><rect class="cell" x="0" y="34" width="50" height="34"/><rect class="cell" x="50" y="34" width="50" height="34"/><rect class="cell" x="100" y="34" width="50" height="34"/><rect class="cell" x="150" y="34" width="50" height="34"/><rect class="cell" x="0" y="68" width="50" height="34"/><rect class="cell" x="50" y="68" width="50" height="34"/><rect class="cell" x="100" y="68" width="50" height="34"/><rect class="cell" x="150" y="68" width="50" height="34"/></g>
    <g fill="#e2e8f0"><rect class="cell" x="0" y="102" width="50" height="34"/><rect class="cell" x="50" y="102" width="50" height="34"/><rect class="cell" x="100" y="102" width="50" height="34"/><rect class="cell" x="150" y="102" width="50" height="34"/></g>
    <text x="218" y="72" class="body">3 live rows</text><text x="218" y="126" class="body">1 capacity row</text>
  </g>

  <!-- operation -->
  <text x="70" y="555" class="mono">score[1×2] @ V[2×4] → output[1×4], repeated for four (b,g) slots</text>
  <text x="965" y="555" class="mono">b0: score[1×1] @ V[1×4] · b1: score[1×3] @ V[3×4]</text>
  <path d="M450 575 L450 610" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1345 575 L1345 610" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- outputs fixed -->
  <text x="70" y="645" class="label">OUTPUT numerator: [bsz=2][G=2][kv_cols=4] = 16 f32 cells</text>
  <text x="965" y="645" class="label">OUTPUT numerator: identical fixed shape and addresses</text>
  <g transform="translate(85,675)">
    <g fill="#fecaca"><rect class="cell" x="0" y="0" width="50" height="40"/><rect class="cell" x="50" y="0" width="50" height="40"/><rect class="cell" x="100" y="0" width="50" height="40"/><rect class="cell" x="150" y="0" width="50" height="40"/></g>
    <g fill="#fed7aa"><rect class="cell" x="0" y="40" width="50" height="40"/><rect class="cell" x="50" y="40" width="50" height="40"/><rect class="cell" x="100" y="40" width="50" height="40"/><rect class="cell" x="150" y="40" width="50" height="40"/></g>
    <g fill="#bbf7d0"><rect class="cell" x="0" y="80" width="50" height="40"/><rect class="cell" x="50" y="80" width="50" height="40"/><rect class="cell" x="100" y="80" width="50" height="40"/><rect class="cell" x="150" y="80" width="50" height="40"/></g>
    <g fill="#bfdbfe"><rect class="cell" x="0" y="120" width="50" height="40"/><rect class="cell" x="50" y="120" width="50" height="40"/><rect class="cell" x="100" y="120" width="50" height="40"/><rect class="cell" x="150" y="120" width="50" height="40"/></g>
    <text x="218" y="27" class="body">b0,g0, d0..d3</text><text x="218" y="67" class="body">b0,g1, d0..d3</text><text x="218" y="107" class="body">b1,g0, d0..d3</text><text x="218" y="147" class="body">b1,g1, d0..d3</text>
  </g>
  <g transform="translate(980,675)">
    <g fill="#fecaca"><rect class="cell" x="0" y="0" width="50" height="40"/><rect class="cell" x="50" y="0" width="50" height="40"/><rect class="cell" x="100" y="0" width="50" height="40"/><rect class="cell" x="150" y="0" width="50" height="40"/></g>
    <g fill="#fed7aa"><rect class="cell" x="0" y="40" width="50" height="40"/><rect class="cell" x="50" y="40" width="50" height="40"/><rect class="cell" x="100" y="40" width="50" height="40"/><rect class="cell" x="150" y="40" width="50" height="40"/></g>
    <g fill="#bbf7d0"><rect class="cell" x="0" y="80" width="50" height="40"/><rect class="cell" x="50" y="80" width="50" height="40"/><rect class="cell" x="100" y="80" width="50" height="40"/><rect class="cell" x="150" y="80" width="50" height="40"/></g>
    <g fill="#bfdbfe"><rect class="cell" x="0" y="120" width="50" height="40"/><rect class="cell" x="50" y="120" width="50" height="40"/><rect class="cell" x="100" y="120" width="50" height="40"/><rect class="cell" x="150" y="120" width="50" height="40"/></g>
    <text x="218" y="27" class="body">b0,g0, d0..d3</text><text x="218" y="67" class="body">b0,g1, d0..d3</text><text x="218" y="107" class="body">b1,g0, d0..d3</text><text x="218" y="147" class="body">b1,g1, d0..d3</text>
  </g>

  <!-- traversal boxes -->
  <rect x="70" y="865" width="765" height="180" rx="12" fill="#ffffff" stroke="#fb923c"/>
  <text x="95" y="900" class="label">origin/main DSD walk</text>
  <text x="95" y="932" class="mono">bind score once, length=N; bind output once</text>
  <text x="95" y="960" class="mono">for b, for g: reset V base; @map(N)</text>
  <text x="95" y="988" class="mono">increment score by N; increment output by kv_cols</text>
  <text x="95" y="1023" class="body">V base reset is required because @map walks V rows.</text>
  <rect x="965" y="865" width="765" height="180" rx="12" fill="#ffffff" stroke="#4ade80"/>
  <text x="990" y="900" class="label">S0 minimal DSD walk</text>
  <text x="990" y="932" class="mono">for b: derive L; if L&gt;0 bind score/output once</text>
  <text x="990" y="960" class="mono">for g: reset V base; @map(L)</text>
  <text x="990" y="988" class="mono">increment score by L; increment output by kv_cols</text>
  <text x="990" y="1023" class="body">V base reset remains; invariant lengths are set only outside the group loop.</text>

  <!-- fused collective -->
  <rect x="70" y="1075" width="1660" height="90" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="95" y="1110" class="label">Fused Y all-reduce arena (unchanged): [16 numerator f32][4 denominator f32] = bsz*(attn_per_pe+G) = 20 f32 cells</text>
  <text x="95" y="1142" class="body">After reduction, each 4-feature output slot is divided by its matching denominator. No communication dimension depends on N or L_b.</text>

  <rect x="35" y="1230" width="1730" height="62" rx="12" fill="#f8fafc" stroke="#64748b"/>
  <text x="60" y="1258" class="body">Notation: L_b=position_current_length(position[b],local_py) · V order=[bsz][kv_len_per_pe][kv_cols] · output order=[bsz][G][kv_cols].</text>
  <text x="60" y="1282" class="small">Source: origin/main b136ab64 + uncommitted S0 working tree. Performance delta is unknown until real CS-3 raw-TSC measurement.</text>
</svg>
