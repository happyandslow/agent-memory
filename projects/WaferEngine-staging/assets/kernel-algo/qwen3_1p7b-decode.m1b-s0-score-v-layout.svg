    <rect class="cell" x="484" y="0" width="44" height="50" fill="#bfdbfe"/><rect class="cell" x="528" y="0" width="44" height="50" fill="#bfdbfe"/><rect class="cell" x="572" y="0" width="44" height="50" fill="#bfdbfe"/>
