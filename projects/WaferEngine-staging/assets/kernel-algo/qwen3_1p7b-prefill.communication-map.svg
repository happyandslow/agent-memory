<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500">
  <rect width="1160" height="500" fill="#f8fafc"/>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:16px;fill:#475569}.label{font-size:19px;font-weight:600}.small{font-size:16px}.box{stroke-width:2;rx:12;ry:12}.arrow{fill:none;stroke-width:2;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#475569"/></marker></defs>
  <text x="40" y="52" class="title">Qwen3-1.7B prefill — on-wafer communication map</text><text x="40" y="82" class="note">Token shards live on X; feature shards live on Y. Every fabric route and count is compile-time coordinate derived.</text>
  <rect class="box" x="40" y="135" width="245" height="120" fill="#ccfbf1" stroke="#0f766e"/><text x="163" y="177" text-anchor="middle" class="label">G-1 / G-2 ingress</text><text x="163" y="204" text-anchor="middle" class="small">P-2 token multicast</text><text x="163" y="228" text-anchor="middle" class="small">head → block 0</text>
  <rect class="box" x="375" y="120" width="385" height="170" fill="#dbeafe" stroke="#2563eb"/><text x="568" y="162" text-anchor="middle" class="label">Prefill layer block</text><text x="568" y="192" text-anchor="middle" class="small">P-1 dim reduce + P-2 broadcast</text><text x="568" y="216" text-anchor="middle" class="small">P-3 Cannon projections · P-7 head-band</text><text x="568" y="241" text-anchor="middle" class="small">P-8 FlashAttention combine</text>
  <rect class="box" x="850" y="135" width="260" height="120" fill="#fef3c7" stroke="#b45309"/><text x="980" y="177" text-anchor="middle" class="label">Attention</text><text x="980" y="204" text-anchor="middle" class="small">P-7 Q·K + max/sum</text><text x="980" y="228" text-anchor="middle" class="small">P-3 rectangular Score×V</text>
  <rect class="box" x="165" y="355" width="310" height="102" fill="#ffe4e6" stroke="#be123c"/><text x="320" y="397" text-anchor="middle" class="label">P-5 / P-6 block pipeline</text><text x="320" y="425" text-anchor="middle" class="small">hidden tile + metadata snake hop</text>
  <rect class="box" x="685" y="355" width="310" height="102" fill="#ede9fe" stroke="#7c3aed"/><text x="840" y="397" text-anchor="middle" class="label">P-4 KV egress seam</text><text x="840" y="425" text-anchor="middle" class="small">row switch-gather → colmux → host</text>
  <path class="arrow" stroke="#0f766e" d="M285 195H375"/><path class="arrow" stroke="#b45309" d="M760 195H850"/><path class="arrow" stroke="#be123c" d="M570 290L320 355"/><path class="arrow" stroke="#7c3aed" d="M570 290L840 355"/>
</svg>
