<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.5-9B decode PE role topology on WSE-3</title>
  <desc id="desc">Model-level component composition and detailed PE roles in the shared layer artifact.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#be123c"/></marker>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#bfdbfe" stroke-width="1"/></pattern>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .h1 { font-size: 30px; font-weight: 700; fill: #172033; }
      .h2 { font-size: 23px; font-weight: 700; fill: #172033; }
      .sub { font-size: 16px; fill: #475569; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; fill: #334155; }
      .small { font-size: 14px; fill: #475569; }
      .center { text-anchor: middle; }
    </style>
  </defs>
  <rect width="1600" height="1180" fill="#ffffff"/>
  <text x="40" y="50" class="h1">Qwen3.5-9B Decode on WSE-3 — PE role topology</text>
  <text x="40" y="82" class="sub">meshrt @ 5d47163b · schematic, not to scale · solid regions are measured component artifacts</text>

  <rect x="40" y="110" width="1520" height="70" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="62" y="137" font-size="17" fill="#9a3412"><tspan font-weight="700">Important:</tspan> Head, Layer, and Tail are three independent layouts, not simultaneously resident regions.</text>
  <text x="62" y="161" font-size="17" fill="#9a3412">The 2-wafer result composes component TSC cycles; the repo does not encode an exact layer-to-wafer map.</text>

  <rect x="55" y="220" width="365" height="130" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="238" y="246" class="box-title center" fill="#5b21b6">HT Head artifact · 256×512</text>
  <text x="238" y="273" class="body center"><tspan x="238">Vocab sharded on Y; hidden on X</tspan><tspan x="238" dy="23">Owner row sends embedding along N/S chains</tspan><tspan x="238" dy="23">to diagonal pair y=2x, 2x+1</tspan></text>

  <rect x="610" y="207" width="390" height="156" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="805" y="235" class="box-title center" fill="#1d4ed8">Shared Layer artifact</text>
  <text x="805" y="262" class="body center"><tspan x="805">B1/B2: 256×256 · B4/B8: 512×512</tspan><tspan x="805" dy="23">Every PE runs Full and GDN paths sequentially</tspan><tspan x="805" dy="23">Shared scratch + mock BF16 weights</tspan><tspan x="805" dy="23">No Attention/FFN spatial split</tspan></text>

  <rect x="1180" y="220" width="365" height="130" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="1362" y="246" class="box-title center" fill="#115e59">HT Tail artifact · 256×512</text>
  <text x="1362" y="273" class="body center"><tspan x="1362">Hidden sharded on Y; vocab on X</tspan><tspan x="1362" dy="23">Y-reduce → root row → local Top-1</tspan><tspan x="1362" dy="23">X argmax chain → result packet</tspan></text>
  <path d="M420 285H610" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow-gray)"/>
  <path d="M1000 285H1180" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow-gray)"/>
  <text x="805" y="391" class="small center"><tspan x="805">Logical model: 24 GDN + 8 Full layers on 2 wafers</tspan><tspan x="805" dy="20">dashed arrows = result composition, not an implemented on-wafer stream</tspan></text>

  <text x="40" y="446" class="h2">Layer artifact: spatial roles inside the P×P compute region</text>

  <rect x="60" y="490" width="120" height="465" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="120" y="523" class="box-title center" fill="#92400e">1×P demux</text>
  <text x="120" y="560" class="body center"><tspan x="120">all PEs peel</tspan><tspan x="120" dy="22">one row grant</tspan><tspan x="120" dy="34">chain:</tspan><tspan x="120" dy="22">bottom → top</tspan><tspan x="120" dy="34">fanout:</tspan><tspan x="120" dy="22">west → east</tspan></text>
  <path d="M95 920V760" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="120" y="940" class="small center">host start</text>

  <rect x="230" y="490" width="800" height="465" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <rect x="250" y="565" width="760" height="350" fill="url(#grid)" stroke="#93c5fd" stroke-width="1"/>
  <text x="630" y="520" class="box-title center" fill="#1e3a8a">Every blue PE: same decode_main_task + local GEMVs + local SRAM state</text>
  <text x="630" y="546" class="small center">PE roles below overlap; roots remain ordinary compute PEs</text>

  <rect x="388" y="565" width="18" height="350" fill="#bbf7d0" fill-opacity=".82" stroke="#16a34a"/>
  <rect x="565" y="565" width="18" height="350" fill="#bbf7d0" fill-opacity=".82" stroke="#16a34a"/>
  <rect x="742" y="565" width="18" height="350" fill="#bbf7d0" fill-opacity=".82" stroke="#16a34a"/>
  <rect x="919" y="565" width="18" height="350" fill="#bbf7d0" fill-opacity=".82" stroke="#16a34a"/>
  <rect x="250" y="635" width="760" height="17" fill="#ddd6fe" fill-opacity=".85" stroke="#7c3aed"/>
  <rect x="250" y="778" width="760" height="17" fill="#ddd6fe" fill-opacity=".85" stroke="#7c3aed"/>

  <rect x="659" y="565" width="30" height="350" fill="#fed7aa" fill-opacity=".72" stroke="#ea580c" stroke-width="2"/>
  <rect x="250" y="719" width="760" height="30" fill="#fed7aa" fill-opacity=".72" stroke="#ea580c" stroke-width="2"/>
  <circle cx="674" cy="734" r="26" fill="#fecdd3" stroke="#be123c" stroke-width="4"/>
  <text x="674" y="740" font-size="14" font-weight="700" fill="#9f1239" text-anchor="middle">TSC</text>
  <text x="674" y="832" class="body center"><tspan x="674" font-weight="700" fill="#9f1239">Timing/result PE</tspan><tspan x="674" dy="22">P=256: (136,136)</tspan><tspan x="674" dy="22">P=512: (264,264)</tspan></text>

  <path d="M280 930H970" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="625" y="950" class="small center" fill="#1d4ed8">local_x → hidden HX + KV sequence positions (position mod P)</text>
  <path d="M242 900V585" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="260" y="887" class="small"><tspan x="260">local_y:</tspan><tspan x="260" dy="19">mixer / FFN / KV / GDN features</tspan></text>

  <path d="M180 683H645" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/>
  <text x="410" y="670" class="small center" fill="#92400e">start grant multicast on every row</text>
  <path d="M700 734H1080" fill="none" stroke="#be123c" stroke-width="3" marker-end="url(#arrow-red)"/>

  <rect x="1080" y="490" width="120" height="465" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="1140" y="523" class="box-title center" fill="#115e59">1×P mux</text>
  <text x="1140" y="568" class="body center"><tspan x="1140">only root-row</tspan><tspan x="1140" dy="22">PE receives</tspan><tspan x="1140" dy="22">the packet</tspan><tspan x="1140" dy="36">router path</tspan><tspan x="1140" dy="22">continues to</tspan><tspan x="1140" dy="22">bottom port</tspan></text>
  <path d="M1140 760V920" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="1140" y="940" class="small center">host result</text>

  <rect x="1240" y="490" width="320" height="465" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="1260" y="522" class="box-title" fill="#334155">Overlapping PE roles</text>
  <rect x="1262" y="543" width="20" height="16" fill="#eff6ff" stroke="#2563eb"/><text x="1292" y="557" class="body">all PEs compute</text>
  <rect x="1262" y="574" width="20" height="16" fill="#bbf7d0" stroke="#16a34a"/><text x="1292" y="588" class="body">X phase-1 roots: x mod 16 = 8</text>
  <rect x="1262" y="605" width="20" height="16" fill="#ddd6fe" stroke="#7c3aed"/><text x="1292" y="619" class="body">Y phase-1 roots: y mod 16 = 8</text>
  <rect x="1262" y="636" width="20" height="16" fill="#fed7aa" stroke="#ea580c"/><text x="1292" y="650" class="body">phase-2 root row / column</text>
  <circle cx="1272" cy="677" r="10" fill="#fecdd3" stroke="#be123c" stroke-width="2"/><text x="1292" y="682" class="body">TSC + result sender</text>
  <text x="1262" y="724" class="body"><tspan x="1262" font-weight="700">Scoped Y-band roots (P=256)</tspan><tspan x="1262" dy="27">Full KV: band 64, roots 32+64k</tspan><tspan x="1262" dy="25">GDN QK: band 16, roots 8+16k</tspan><tspan x="1262" dy="25">GDN value: band 8, roots 4+8k</tspan></text>
  <text x="1262" y="842" class="body"><tspan x="1262" font-weight="700">Collective topology</tspan><tspan x="1262" dy="27">group-16 hierarchical chain</tspan><tspan x="1262" dy="24">SUM/MAX → router multicast</tspan><tspan x="1262" dy="24">P-1 + P-2 taxonomy</tspan></text>

  <rect x="40" y="995" width="1520" height="145" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="65" y="1025" class="body"><tspan font-weight="700">Per-PE data (P=256 / P=512):</tspan><tspan> hidden HX 16 / 8 per X column · mixer H 16 / 8, FFN F 48 / 24, KV feature 4 / 2 per Y row · KV cache 18 / 9 positions per X column.</tspan></text>
  <text x="65" y="1060" class="body"><tspan font-weight="700">Full:</tspan><tspan> projection [X] → KV-head Y bands → score max/value [X] → output [Y] → FFN up [X] → FFN down [Y].</tspan></text>
  <text x="65" y="1095" class="body"><tspan font-weight="700">GDN:</tspan><tspan> projection [X] → QK/value-head Y bands → recurrence contractions [X] → output [Y] → same FFN.</tspan></text>
  <text x="65" y="1125" class="small">Colors 0–4 are synchronously repainted between X, Y, and scoped-band domains; start/result use colors 6/5.</text>
</svg>
